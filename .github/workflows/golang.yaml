name: Go package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 显式指定模块代理：默认的 direct 直连 git 在 CI 上会因网络不稳定而失败，
      # 且没有任何重试。代理失败时自动回落 direct。
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 只用 go.mod 里声明的已发布依赖，与下游 go get 拿到的形态一致。
      # 关闭 CGO：发行版二进制就是这样构建的，CI 必须在同一形态下验证。
      - name: Build (CGO off)
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
