name: Release

# 打 tag（v*）即发版：构建全平台二进制、生成校验和、创建 GitHub Release。
#
# 版本号只以 tag 为准，二进制内的版本信息由 goreleaser 用 -ldflags 注入，
# 因此"下载到的二进制自报的版本"必然等于 tag。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # 大部分 storage-lock/* 依赖是私有仓库，模块代理上不存在，
      # 必须用带凭据的 git 直连。GOPRIVATE 让 go 跳过代理与校验和库，
      # 由下面的 git -> url.insteadOf 注入凭证。
      GOPRIVATE: github.com/storage-lock/*
      GONOSUMDB: github.com/storage-lock/*
      GONOSUMCHECK: "1"
      # 兜底：公开依赖仍走代理，避免直连时偶发失败导致整体失败。
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser 的 changelog 依赖完整 git 历史与 tag
          fetch-depth: 0
          # skills/ 是子模块，归档里要把它一并打进去（Agent 拿到二进制就能用技能定义）。
          # 默认 checkout 不会填充子模块，导致归档缺整个 skills 目录。
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 用仓库 secret 给 git 配好私有模块的读取凭证。
      # 不把 token 写进 URL（那样会留在 .git/config 与日志里），
      # 用 url.insteadOf + GIT_ASKPASS 更干净。
      - name: Configure private module access
        env:
          TOKEN: ${{ secrets.GOPRIVATE_GITHUB_TOKEN }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global "url.https://x-access-token:${TOKEN}@github.com/.insteadOf" "https://github.com/"
          # 让 go 用 git 读私有仓库时不再尝试交互式认证
          git config --global advice.detachedHead false

      # 发布前先跑一遍测试：宁可发不出去，也不发一个装不上的版本。
      - name: Test
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
