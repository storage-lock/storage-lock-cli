name: Release

# 打 tag（v*）即发版：构建全平台二进制、生成校验和、创建 GitHub Release。
#
# 版本号只以 tag 为准，二进制内的版本信息由 goreleaser 用 -ldflags 注入，
# 因此"下载到的二进制自报的版本"必然等于 tag。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # 所有依赖都是公开仓库，走公共代理即可。
      # （此前依赖是私有的，需要 GOPRIVATE + token 直连；转公开后已移除，
      #   不再在 CI 里保留多余的长期凭据。）
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser 的 changelog 依赖完整 git 历史与 tag
          fetch-depth: 0
          # skills/ 是子模块，归档里要把它一并打进去（Agent 拿到二进制就能用技能定义）。
          # 默认 checkout 不会填充子模块，导致归档缺整个 skills 目录。
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 发布前先跑一遍测试：宁可发不出去，也不发一个装不上的版本。
      - name: Test
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
